<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Generator</title>

    <style>
        
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f0f4f8;
        margin: 0;
        padding: 30px 15px;
        color: #263238;
    }

    .container {
        max-width: 650px;
        margin: 20px auto;
        background: white;
        padding: 30px;
        border-radius: 14px;
        box-shadow: 0 5px 20px #00000012;
    }

    h1 {
        text-align: center;
        color: #243b64;
        margin-bottom: 10px;
    }

    h2 {
        color: #243b64;
    }

    label {
        display: block;
        margin-top: 16px;
        margin-bottom: 6px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccd5e0;
        border-radius: 7px;
        font-size: 15px;
    }

    input:focus {
        outline: 2px solid #8bb5f0;
        border-color: #477bd1;
    }

    button {
        width: 100%;
        padding: 13px;
        margin-top: 18px;
        background: #315da8;
        color: white;
        border: none;
        border-radius: 7px;
        font-size: 15px;
        cursor: pointer;
    }

    button:hover {
        background: #24477f;
    }

    .dashboard {
        background: #edf3ff;
        padding: 15px;
        border-radius: 9px;
        margin: 20px 0;
    }

    .dashboard p {
        margin: 8px 0;
    }

    .history-link {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: #315da8;
        text-decoration: none;
        font-weight: bold;
    }

    #total {
        text-align: center;
        background: #eaf8ef;
        padding: 12px;
        border-radius: 7px;
        color: #176b3a;
    }
</style>

    </style>
</head>

<body>
<div class="container">
    <h1>Invoice Generator</h1>
    
<div class="dashboard">
    <h2>Dashboard Summary</h2>

    <p>
        Total Invoices:
        <strong>{{ summary["invoice_count"] }}</strong>
    </p>

    <p>
        Total Sales:
        <strong>Rs. {{ "%.2f"|format(summary["total_sales"]) }}</strong>
    </p>
</div>

<p>
    <a href="/history">View Previous Invoices</a>
</p>
    <form action="/download" method="POST">
        <label>Customer Name</label>
        <input type="text" name="customer" required>

        
<h2>Product Details</h2>

<div id="product-list">
    <div class="product-row">
        <label>Product Name</label>
        <input type="text" name="product[]" required>

        <label>Quantity</label>
        <input type="number" name="quantity[]" class="quantity"
               min="1" value="1" required>

        <label>Price per Item (Rs.)</label>
        <input type="number" name="price[]" class="price"
               min="0.01" step="0.01" required>
    </div>
</div>

<button type="button" onclick="addProduct()">
    + Add Another Product
</button>

<button type="button" onclick="calculateBill()">
    Calculate Grand Total
</button>

<h2 id="total">Grand Total: Rs. 0.00</h2>


        <button type="submit">Download Invoice PDF</button>
    </form>
</div>

<script>
    
    
function addProduct() {
    const list = document.getElementById("product-list");
    const row = document.createElement("div");

    row.className = "product-row";

    row.innerHTML = `
        <hr>
        <label>Product Name</label>
        <input type="text" name="product[]" required>

        <label>Quantity</label>
        <input type="number" name="quantity[]" class="quantity"
               min="1" value="1" required>

        <label>Price per Item (Rs.)</label>
        <input type="number" name="price[]" class="price"
               min="0.01" step="0.01" required>

        <button type="button"
                onclick="this.parentElement.remove()">
            Remove Product
        </button>
    `;

    list.appendChild(row);
}

function calculateBill() {
    const rows = document.querySelectorAll(".product-row");
    let total = 0;

    for (const row of rows) {
        const name = row.querySelector('[name="product[]"]').value.trim();
        const quantity = Number(row.querySelector(".quantity").value);
        const price = Number(row.querySelector(".price").value);

        if (!name || !Number.isInteger(quantity) ||
            quantity <= 0 || !Number.isFinite(price) || price <= 0) {
            alert("Enter valid details for every product.");
            return;
        }

        total += quantity * price;
    }

    document.getElementById("total").textContent =
        "Grand Total: Rs. " + total.toFixed(2);
}

</script>
</body>
</html>
